[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-grpo"
version = "0.1.0"
description = "Interleaved Code Execution via Multi-Turn Group Relative Policy Optimization (RLVR)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Arman", email = "armancodes101@gmail.com"}
]
keywords = ["llm", "reasoning", "reinforcement-learning", "grpo", "rlvr", "code-execution", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.45.0",
    "peft>=0.11.0",
    "trl>=0.9.0",
    "sympy>=1.12",
    "datasets>=2.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
